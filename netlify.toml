[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Required Netlify environment variables (Site settings → Environment variables):
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SERVICE_ROLE_KEY   ← required for stock scan + billing attach APIs
#   AUTH_SECRET                 ← required for login sessions (32+ random chars)
#
# After deploy, apply pending DB migrations locally:
#   npm run db:push   (includes 011 bag-based inventory)
# (needs SUPABASE_DB_PASSWORD — not needed on Netlify runtime)
